name: Publicar Residual na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: residual-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_ISO_STORAGE: ${{ vars.VITE_ISO_STORAGE }}
      VITE_ENABLE_GOOGLE_AUTH: ${{ vars.VITE_ENABLE_GOOGLE_AUTH }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Verificar autenticação e gestão de acessos
        run: node --test tests/client-portal-session.test.mjs tests/client-portal-rules.test.mjs
      - name: Compilar aplicativo estático
        run: npm run build:cloudflare
      - name: Publicar na conta definitiva
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Configure o secret CLOUDFLARE_API_TOKEN para o Worker residual na conta definitiva."
            exit 1
          fi
          node scripts/cloudflare.mjs deploy
      - name: Conferir versão publicada
        run: node scripts/verify-cloudflare-deploy.mjs
